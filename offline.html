<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오프라인 — 오늘의 주식</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f7f9; --text: #16191d; --muted: #6b7280; --accent: #2f5bea; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f1216; --text: #e8eaee; --muted: #98a0ab; --accent: #7c9cff; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; padding: 0 24px; text-align: center; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: var(--muted); font-size: 14px; margin: 0 0 20px; line-height: 1.6; }
      button { border: 0; border-radius: 10px; background: var(--accent); color: #fff; padding: 10px 18px; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>인터넷에 연결되어 있지 않습니다</h1>
      <p>종목 데이터는 매일 새로 갱신되어 연결이 필요합니다.<br />연결을 확인한 뒤 다시 시도해 주세요.</p>
      <button onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
